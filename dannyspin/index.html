<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DannySpin — spin the wheel</title>
<meta name="description" content="Enter names, spin the wheel, and let it pick a random winner.">
<link rel="icon" href="assets/danny.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-glow" aria-hidden="true"></div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">Danny<span class="accent">Spin</span></div>
    <div class="topbar-right">
      <a class="nav-link" href="/">🦖 DanoPass</a>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
        <span class="theme-toggle-track">
          <span class="theme-toggle-thumb">
            <svg id="themeIconSun" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg id="themeIconMoon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
          </span>
        </span>
      </button>
    </div>
  </div>
</header>

<main>
  <section class="hero">
    <h1 class="hero-title">Spin it. Settle it.</h1>
    <p class="tagline">Add some names and let the wheel make the call.</p>
  </section>

  <section class="spin-layout">

    <div class="wheel-col">
      <div class="wheel-wrap" id="wheelWrap">
        <div class="wheel-pointer" aria-hidden="true"></div>
        <canvas id="wheelCanvas" width="600" height="600"></canvas>
        <div class="wheel-hub">
          <img src="assets/danny.png" alt="" class="wheel-hub-img">
        </div>
        <p class="wheel-empty-state" id="wheelEmptyState">Add names to<br>build the wheel</p>
      </div>
      <button id="spinBtn" class="btn-spin" type="button">Spin the wheel</button>
      <p id="spinHint" class="spin-hint">Add at least 2 names to spin.</p>
    </div>

    <div class="entries-col">
      <div class="entries-card">
        <div class="entries-head">
          <span class="entries-title">Names</span>
          <span class="entries-count" id="entriesCount">0 segments</span>
        </div>
        <textarea id="entriesInput" class="entries-textarea" rows="12" spellcheck="false"
          placeholder="One name per line, e.g.&#10;Rob&#10;Danny&#10;Jarred"></textarea>
        <div class="entries-actions">
          <button id="shuffleBtn" class="btn-chip" type="button">Shuffle</button>
          <button id="sampleBtn" class="btn-chip" type="button">Sample names</button>
          <button id="clearBtn" class="btn-chip btn-chip-danger" type="button">Clear</button>
        </div>
      </div>
    </div>

  </section>
</main>

<footer class="site-footer">
  <p>DannySpin picks entirely in your browser — nothing you type here is sent anywhere or stored.</p>
</footer>

<!-- Winner modal -->
<div class="modal-overlay" id="winnerOverlay" hidden>
  <div class="winner-card" role="dialog" aria-modal="true" aria-labelledby="winnerName">
    <div class="winner-glow" aria-hidden="true"></div>
    <p class="winner-trophy" aria-hidden="true">🏆</p>
    <p class="winner-eyebrow">And the wheel says...</p>
    <p class="winner-name" id="winnerName">—</p>
    <div class="winner-actions">
      <button id="spinAgainBtn" class="btn-spin btn-spin-small" type="button">Spin again</button>
      <button id="closeWinnerBtn" class="btn-chip" type="button">Close</button>
    </div>
  </div>
</div>

<canvas id="confettiCanvas" aria-hidden="true"></canvas>
<div id="winFlash" class="win-flash" aria-hidden="true"></div>

<script src="script.js"></script>
</body>
</html>
