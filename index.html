<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DanoPass — VW-Powered Password Generator</title>
<meta name="description" content="A fun VW-themed twist on password generators. Generate simple or complex passwords built from Volkswagen and car words.">
<link rel="icon" href="assets/dano.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-glow" aria-hidden="true"></div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">Dano<span class="accent">Pass</span></div>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
      <span class="theme-toggle-track">
        <span class="theme-toggle-thumb">
          <svg id="themeIconSun" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg id="themeIconMoon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </span>
      </span>
    </button>
  </div>
</header>

<main>
  <section class="hero">
    <h1 class="hero-title">Passwords, fresh off the assembly line.</h1>

    <div class="mascot-card">
      <img class="mascot" src="assets/dano.png" alt="DanoPass mascot — a friendly blue dinosaur with a human face, standing on a stone slab" width="1165" height="1350">
      <span class="eye-socket" id="eyeSocketLeft" aria-hidden="true"><span class="eye-pupil" id="eyePupilLeft"></span></span>
      <span class="eye-socket" id="eyeSocketRight" aria-hidden="true"><span class="eye-pupil" id="eyePupilRight"></span></span>
      <div class="stone-password" id="passwordOutput" aria-live="polite">tap&nbsp;generate</div>
      <button id="copyBtn" class="copy-chip" type="button" aria-label="Copy password to clipboard" disabled>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>
    </div>
    <p id="copyHint" class="copy-hint">&nbsp;</p>
  </section>

  <section class="generator" aria-label="Password generator">
    <div class="buttons">
      <button id="simpleBtn" class="btn btn-blue" type="button">
        <span class="btn-title">Simple</span>
        <span class="btn-sub">two words + two numbers</span>
      </button>
      <button id="complexBtn" class="btn btn-orange" type="button">
        <span class="btn-title">Complex</span>
        <span class="btn-sub">Word + 4 digits + Word</span>
      </button>
    </div>

    <div class="options">
      <label class="switch-row">
        <span class="switch">
          <input type="checkbox" id="symbolsToggle">
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </span>
        <span class="switch-label">
          <span class="switch-title">Include a symbol</span>
          <span class="switch-desc">adds one character from a safe set: ! @ # $ % &amp; * - +</span>
        </span>
      </label>
      <label class="switch-row">
        <span class="switch">
          <input type="checkbox" id="mixedCaseToggle">
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </span>
        <span class="switch-label">
          <span class="switch-title">MiXeD-case letters</span>
          <span class="switch-desc">randomly capitalises letters inside each word</span>
        </span>
      </label>
    </div>
  </section>
</main>

<footer class="site-footer">
  <p>DanoPass is a fan-made, tongue-in-cheek project inspired by dinopass.com. Not affiliated with Volkswagen AG. Nothing you generate here is sent anywhere or stored.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
